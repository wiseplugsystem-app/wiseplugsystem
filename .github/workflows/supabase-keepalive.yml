# Keeps the free Supabase project awake: free projects pause after 7 days
# with no activity. Runs every 3 days at no cost.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL  https://<project-ref>.supabase.co
#   SUPABASE_KEY  the project's publishable (anon) key
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive() database function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
